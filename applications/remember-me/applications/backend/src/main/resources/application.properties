spring.application.name=remember-me-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/remember_me
spring.datasource.username=remember_me
spring.datasource.password=remember_me
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Spring Boot already defaults this to true; stated explicitly since
# NFR-001 requires the JSESSIONID cookie to be HttpOnly.
server.servlet.session.cookie.http-only=true

# Faz 3 (UC-002): signing key for Spring Security's TokenBasedRememberMeServices.
# Deliberately a fixed value rather than leaving it unset (which makes Spring
# Security generate a random key at startup): a random key would invalidate
# every outstanding remember-me cookie on each restart, which is fine
# functionally for a lab but not a deliberate choice. Hardcoding a dev secret
# here (not a real secret, never used outside this lab) keeps tokens valid
# across restarts and keeps the value in one obvious place instead of
# scattered across config classes.
app.remember-me.key=remember-me-lab-dev-key-2026

# Faz 4 (UC-004/UC-005): how long a remember-me cookie stays valid, in
# seconds. 1209600 (14 days) is Spring Security's own default
# (AbstractRememberMeServices.TWO_WEEKS_S) - stated explicitly here rather
# than left implicit so this is the one line to shorten when demoing/testing
# expiry. To reproduce UC-005's Test Adimi 3 by hand, temporarily set this to
# e.g. 30, restart the backend, log in with "Remember Me" checked, wait 30+
# seconds, delete the JSESSIONID cookie (or let the session expire too), and
# reload a protected page - the request is rejected and lands back on login.
app.remember-me.token-validity-seconds=1209600

# Faz 6 (UC-010, FR-010/NFR-005): the single config value that switches
# between Spring Security's two remember-me strategies. This is the ONE
# line to edit to switch modes - restart the backend afterwards, no other
# file needs to change (BR-013). Unrecognized values fail application
# startup fast (UC-010 A1) rather than silently picking a default - see
# RememberMeStrategy.
#
#   token      - Faz 3's default: stateless, HMAC-signed cookie
#                (TokenBasedRememberMeServices). No server-side record.
#   persistent - database-backed (PersistentTokenBasedRememberMeServices),
#                backed by the persistent_logins table - see
#                PersistentLogin.java and
#                SecurityConfig#persistentTokenRepository. Each remember-me
#                login writes/updates one row there.
app.remember-me.strategy=token

# Faz 8 (UC-014, FR-014/NFR-003): how often ExpiredPersistentLoginCleanupJob
# runs, in milliseconds. 3600000 (1 hour) is a reasonable production
# default - persistent_logins only ever needs trimming occasionally, not on
# every tick. To reproduce UC-014's Test Adimi 1/3 by hand, temporarily set
# this (and app.remember-me.token-validity-seconds, e.g. to 5) to something
# short like 2000, restart the backend, log in with "Remember Me" checked
# under app.remember-me.strategy=persistent, wait past both values, and
# watch the row disappear from the Token Inspector on the next tick.
app.remember-me.cleanup-interval-ms=3600000

# Faz 9 (UC-015, FR-015/BR-022): custom names for the remember-me cookie and
# the login form's opt-in request parameter, instead of Spring Security's
# shared "remember-me" default for both. These are this app's actual chosen
# values (see the use case's main scenario). RememberMeNames.from(...) reads
# both properties and gracefully falls back to Spring's own default
# ("remember-me") for whichever one is missing or left blank (UC-015 A1) -
# delete either line and restart to see that fallback instead of a startup
# failure. The parameter name is also served to the frontend by
# GET /api/auth-status (see AuthStatusController), so LoginForm.jsx sends
# its opt-in checkbox field under this same value without hardcoding it -
# this file is the one place both sides actually agree on the name (BR-022).
#
# The cookie name is a backend-only concern: it never needs to be known by
# the frontend (HttpOnly, delivered via Set-Cookie, the browser re-attaches
# it automatically), only by Spring Security's own rememberMe() DSL and the
# logout cookie-clearing list.
app.remember-me.cookie-name=notes-rm
app.remember-me.parameter-name=keep-me

# Faz 10 (UC-016/UC-017, FR-016/FR-017, BR-023/BR-024): whether a persistent
# remember-me record is bound to the client IP it was created from, and
# whether auto-login enforces that binding. Only meaningful under
# app.remember-me.strategy=persistent - see IpBoundPersistentTokenBasedRememberMeServices's
# javadoc for why token-based mode has no equivalent. Defaults to false (off)
# so Faz 3-9's behavior is unchanged unless explicitly opted into; restart
# the backend after changing this, same as app.remember-me.strategy.
#
#   false (default) - IP is never recorded on new logins, and auto-login
#                      never checks it, regardless of any bound_ip value
#                      already stored on older rows (UC-016 A2).
#   true             - every new persistent login records the client IP
#                       (persistent_logins.bound_ip); every auto-login via a
#                       persistent cookie is rejected (clean, no 500 - falls
#                       through to a normal login prompt) unless the request
#                       IP matches that record's bound IP exactly (BR-023).
app.remember-me.ip-binding-enabled=false
