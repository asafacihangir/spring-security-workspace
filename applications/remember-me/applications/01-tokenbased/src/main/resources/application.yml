debug: false

logging:
  level:
    org.springframework.security: TRACE

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/remember_me
    driverClassName: com.mysql.cj.jdbc.Driver
    username: remember_me
    password: remember_me

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  
  sql:
    init:
      mode: always
      continue-on-error: true
